name: CI

on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      # Los tests de base de datos abren el SQLite del sistema.
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-0

      - run: flutter pub get

      - name: Código generado de Drift al día
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib/data/local/app_database.g.dart

      - run: flutter analyze

      - run: flutter test
