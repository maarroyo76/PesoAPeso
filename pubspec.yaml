name: gasto_a_mano
description: "Peso a Peso — Registra tus gastos, peso a peso. MVP de app de presupuesto y gastos: registro manual, local-first, sin datos bancarios."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1        # manejo de estado
  drift: ^2.16.0                  # capa SQLite type-safe
  sqlcipher_flutter_libs: ^0.6.1  # SQLite cifrado (RNF01/RNF02) — reemplaza a sqlite3_flutter_libs, no usar ambos (conflictan en iOS/macOS)
  sqlite3: ^2.4.0                 # package:sqlite3/open.dart — override para cargar libsqlcipher.so
  flutter_secure_storage: ^9.2.2  # guarda la clave de cifrado de la base de datos (Keystore/Keychain)
  path_provider: ^2.1.3
  path: ^1.9.0
  fl_chart: ^0.68.0               # gráficos (torta, barras)
  intl: ^0.19.0                   # formato de moneda y fechas en es_CL
  meta: ^1.15.0
  file_picker: ^11.0.2
  flutter_local_notifications: ^22.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.16.0
  build_runner: ^2.4.9
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/peso_a_peso_mark.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/peso_a_peso_mark.png"
    background_color: "#E7DEEC"
    theme_color: "#4B2E6B"

flutter:
  uses-material-design: true
  fonts:
    - family: CrimsonPro
      fonts:
        - asset: assets/fonts/CrimsonPro-Variable.ttf
          weight: 400
        - asset: assets/fonts/CrimsonPro-Variable.ttf
          weight: 500
        - asset: assets/fonts/CrimsonPro-Variable.ttf
          weight: 600
        - asset: assets/fonts/CrimsonPro-Variable.ttf
          weight: 700
        - asset: assets/fonts/CrimsonPro-Italic-Variable.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/CrimsonPro-Italic-Variable.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/CrimsonPro-Italic-Variable.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/CrimsonPro-Italic-Variable.ttf
          weight: 700
          style: italic
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700
